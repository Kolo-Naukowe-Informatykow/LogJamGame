name: Feature
description: Zaproponuj nową funkcję albo usprawnienie.
labels: ["enhancement"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Opisz pomysł własnymi słowami — bez sztywnego szablonu.
        Zgłoszenie trafi na tablicę projektu jako zadanie typu **Feature**.

  - type: textarea
    id: idea
    attributes:
      label: Opisz swój pomysł
      description: Co chcesz dodać lub zmienić i po co? To pole jest wymagane.
      placeholder: "Np. chciałbym ekran pauzy z możliwością powrotu do menu..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Dodatkowy kontekst (opcjonalnie)
      description: Linki, zrzuty, alternatywy, przykłady — jeśli chcesz coś dodać.
    validations:
      required: false
